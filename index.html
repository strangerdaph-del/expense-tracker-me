<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#222; --muted:#777; --accent:#6c5ce7; --border:#e2e4ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151a; --card:#1e2028; --text:#eee; --muted:#9a9db0; --accent:#8c7ef0; --border:#2c2f3a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; text-align:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  form { display:flex; flex-direction:column; gap:10px; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button.add { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  .total { text-align:center; font-size:1.3rem; margin:0; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .head h2 { font-size:1.1rem; margin:0; }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  li:last-child { border-bottom:none; }
  .name { font-weight:600; }
  .meta { font-size:.8rem; color:var(--muted); }
  .right { display:flex; align-items:center; gap:10px; }
  .del { background:none; border:none; color:#e74c3c; cursor:pointer; font-size:1.1rem; padding:4px; }
  .empty { text-align:center; color:var(--muted); padding:12px 0; }
</style>
</head>
<body>
<main>
  <h1>My Expense Tracker</h1>

  <div class="card">
    <form id="form">
      <input id="desc" placeholder="What did you spend on?" required>
      <input id="amount" type="number" step="0.01" min="0" placeholder="Amount (RM)" required>
      <select id="category">
        <option>Food</option><option>Transport</option><option>Shopping</option><option>Other</option>
      </select>
      <button class="add" type="submit">Add</button>
    </form>
  </div>

  <div class="card"><h2 class="total" id="total">Total: RM 0.00</h2></div>

  <div class="card">
    <div class="head">
      <h2>My Expenses</h2>
      <select id="filter">
        <option>All</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Other</option>
      </select>
    </div>
    <ul id="list"></ul>
  </div>
</main>

<script>
  let expenses = [];
  try { expenses = JSON.parse(localStorage.getItem('expenses') || '[]'); } catch (e) {}

  const $ = id => document.getElementById(id);
  const save = () => { try { localStorage.setItem('expenses', JSON.stringify(expenses)); } catch (e) {} };

  function render() {
    const f = $('filter').value;
    const shown = expenses.filter(x => f === 'All' || x.category === f);
    const total = shown.reduce((s, x) => s + x.amount, 0);
    $('total').textContent = 'Total: RM ' + total.toFixed(2);
    $('list').innerHTML = '';
    if (!shown.length) {
      $('list').innerHTML = '<li class="empty">No expenses yet</li>';
      return;
    }
    shown.slice().reverse().forEach(x => {
      const li = document.createElement('li');
      const left = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'name'; name.textContent = x.desc;
      const meta = document.createElement('div');
      meta.className = 'meta'; meta.textContent = x.category + ' · ' + x.date;
      left.append(name, meta);
      const right = document.createElement('div');
      right.className = 'right';
      const amt = document.createElement('span');
      amt.textContent = 'RM ' + x.amount.toFixed(2);
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.title = 'Delete';
      del.onclick = () => { expenses = expenses.filter(e => e.id !== x.id); save(); render(); };
      right.append(amt, del);
      li.append(left, right);
      $('list').append(li);
    });
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    expenses.push({
      id: Date.now(),
      desc: $('desc').value.trim(),
      amount: parseFloat($('amount').value),
      category: $('category').value,
      date: new Date().toLocaleDateString('en-MY')
    });
    save(); render();
    $('desc').value = ''; $('amount').value = ''; $('desc').focus();
  });
  $('filter').addEventListener('change', render);
  render();
</script>
</body>
</html>
